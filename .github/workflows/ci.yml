name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record native environment and exact source identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $volumes = Get-Volume | Where-Object DriveLetter | Select-Object DriveLetter, FileSystem, FileSystemLabel
          $os = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture
          $metadata = @{
            source_commit = (git rev-parse HEAD)
            package_tree = (git rev-parse HEAD:nodus)
            tests_tree = (git rev-parse HEAD:tests)
            python = (python --version)
            os = $os
            volumes = $volumes
            source_path = (Get-Location).Path
            temp_path = $env:TEMP
          }
          $metadata | ConvertTo-Json -Depth 5 | Set-Content evidence/environment.json
          Get-Content evidence/environment.json
      - run: python -m pip install -e ".[dev]" build
      - name: Run full SDK suite on native Windows
        run: python -m pytest -q -ra --junitxml=evidence/sdk-tests.xml
      - name: Build the universal wheel
        if: matrix.python-version == '3.12'
        run: python -m build --wheel
      - name: Record immutable wheel identity
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          Get-FileHash dist/*.whl -Algorithm SHA256 | Select-Object Path, Hash, Algorithm | ConvertTo-Json | Set-Content evidence/wheel.json
          Get-Content evidence/wheel.json
      - name: Verify native bootstrap and repeat installation
        if: matrix.python-version == '3.12'
        shell: bash
        run: python scripts/verify-agent-install.py --wheel dist/*.whl
      - name: Verify installed wheel native transfers
        if: matrix.python-version == '3.12'
        shell: bash
        run: python scripts/verify-release.py --wheel dist/*.whl --local-transfers --report evidence/windows-transfers.json
      - name: Verify installed wheel full SDK, CLI and MCP suite
        if: matrix.python-version == '3.12'
        shell: bash
        run: python scripts/verify-release.py --wheel dist/*.whl --report evidence/installed-wheel.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.python-version }}-qualification
          path: |
            evidence/
            dist/*.whl
