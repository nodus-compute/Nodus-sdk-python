name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling: a client library is the one dependency a
        # customer cannot upgrade around, so both ends of the support range run.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # twine check is what catches a README PyPI will not render, before a
      # release rather than after it.
      - run: python -m twine check dist/*
      # Run the suite from outside the tree so `import nodus` can only resolve
      # to the installed wheel — the artifact customers download.
      - name: test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          "$RUNNER_TEMP/wheel-venv/bin/pip" install dist/*.whl pytest pytest-asyncio
          mkdir "$RUNNER_TEMP/wheel-run"
          # Include documentation fixtures without copying the importable SDK.
          cp -r tests docs examples openapi README.md LICENSE RELEASING.md pyproject.toml "$RUNNER_TEMP/wheel-run/"
          cd "$RUNNER_TEMP/wheel-run"
          "$RUNNER_TEMP/wheel-venv/bin/python" -m pytest -q tests
