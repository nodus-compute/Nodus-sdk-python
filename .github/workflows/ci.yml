name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agent-install:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Verify native bootstrap and repeat installation
        run: python scripts/verify-agent-install.py --wheel dist/nodus_compute-0.5.1-py3-none-any.whl

  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" uv build
      - run: python -m build --wheel
      - run: python scripts/verify-plugins.py --wheel dist/nodus_compute-0.5.1-py3-none-any.whl

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling: a client library is the one dependency a
        # customer cannot upgrade around, so both ends of the support range run.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # twine check is what catches a README PyPI will not render, before a
      # release rather than after it.
      - run: python -m twine check dist/*
      # Run the suite from outside the tree so `import nodus` can only resolve
      # to the installed wheel — the artifact customers download.
      - name: test the installed wheel
        run: |
          python scripts/verify-release.py --wheel dist/*.whl --report "$RUNNER_TEMP/release-verification.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification
          path: ${{ runner.temp }}/release-verification.json
