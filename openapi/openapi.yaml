        "description": "Send the exact bytes identified by this zero-based segment index in the manifest. Content-Length is required and must match the declared segment. Content-Type must be exactly application/octet-stream. Chunked transfer encoding is not accepted. Segments are checked against their declared size and SHA256. Retry with the same transfer and segment after an uncertain reply.",
