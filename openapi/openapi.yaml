            "description": "id"
          }
        ],
        "description": "Requires stopped compute, no active transfer and the observed current revision. Repeating the same live revision reuses its fixed 24-hour export. Does not start compute or require credits. Concatenate segments in manifest order and verify their hashes and the complete archive before publishing the local file. Saved files use version 3 storage.",
        "requestBody": {
