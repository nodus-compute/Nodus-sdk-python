{
  "openapi": "3.1.0",
  "info": {
    "title": "Nodus Workloads API",
    "version": "1.0.0",
    "description": "Provider-neutral infrastructure execution for AI workloads. This contract describes customer API-key workload and webhook operations. Console sign-in, operator, runner and supplier protocols are outside its scope. Obtain a key using nodus login or the console. Use the deployment API origin as the base URL. No paid workload is executed by viewing this contract."
  },
  "servers": [
    {
      "url": "/",
      "description": "Set this to your deployment API origin (the same NODUS_BASE_URL used by the SDK)."
    }
  ],
  "security": [
    {
      "ApiKey": []
    }
  ],
  "tags": [
    {
      "name": "Workloads"
    },
    {
      "name": "Webhooks"
    },
    {
      "name": "Assets"
    }
  ],
  "paths": {
    "/v1/workloads": {
      "post": {
        "operationId": "createWorkload",
        "summary": "Submit a workload",
        "tags": [
          "Workloads"
        ],
        "responses": {
          "202": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/SubmitResult"
                }
              }
            },
            "headers": {
              "Idempotent-Replayed": {
                "description": "true on a replay of the original submission.",
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "default": {
            "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "description": "Required stable key per logical submission. Replay the same payload with the same key. Different payload returns 409."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/WorkloadPayload"
              }
            }
          }
        },
        "description": "202 means accepted, not running. 402 budget_exceeded is the account monthly cap. 409 is an idempotency conflict. 503 spend_check_unavailable may be retried using the same key."
      },
      "get": {
        "operationId": "listWorkloads",
        "summary": "List workloads",
        "tags": [
          "Workloads"
        ],
        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "properties": {
                    "workloads": {
                      "type": "array",
                      "items": {
                        "$ref": "#/components/schemas/WorkloadListItem"
                      }
                    },
                    "next_offset": {
                      "type": "integer"
                    }
                  }
                }
              }
            }
          },
          "default": {
            "description": "Error. The JSON error and message fields are stable. Additional fields may provide details. Authentication, rate limits, and transient failures apply to all operations.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "Page size. 1\u2013100. Omitted, nonpositive, or over 100 defaults to 50."
          },
          {
            "name": "offset",
            "in": "query",
            "required": false,
            "schema": {
              "type": "integer"
            },
            "description": "Offset returned by the previous page. Omitted starts at zero."
          },
          {
            "name": "status",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string"
            },
            "description": "Comma-separated statuses. Active and terminal expand to lifecycle groups. Unknown tokens are ignored."
          },
          {
            "name": "scope",
            "in": "query",
            "required": false,
            "schema": {
              "type": "string",
              "enum": [
                "mine",
                "team"
              ],
              "default": "team"
            },
            "description": "Team lists all workloads in your team. Mine lists workloads attributed to the authenticated member before pagination. Mine requires a member-associated credential and returns attribution_required otherwise. Historical workloads and shared keys can have no owner. This filter does not change shared team access."
          }
        ]
      }
    },
    "/v1/workloads/{id}": {
      "get": {
        "operationId": "getWorkload",
        "summary": "Get workload status, stages, route and meter",
        "tags": [
          "Workloads"
        ],
        "responses": {
          "200": {
            "description": "Success",
